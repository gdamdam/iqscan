[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "iqscan"
dynamic = ["version"]
description = "Find candidate activity in complex IQ recordings"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.25,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["playwright>=1.48,<2"]
video = ["Pillow>=10,<13", "skyfield>=1.50,<2", "tzdata; sys_platform == 'win32'"]

[project.scripts]
iqscan = "iqscan.iq_scan:main"

[tool.setuptools]
packages = ["iqscan"]

[tool.setuptools.dynamic]
version = {attr = "iqscan.iq_scan.__version__"}

[project.urls]
Homepage = "https://github.com/gdamdam/iqscan"
Issues = "https://github.com/gdamdam/iqscan/issues"

[tool.ruff]
line-length = 200
extend-exclude = ["build"]

[tool.ruff.lint]
# Short statements and imports are deliberately joined on one line in this codebase;
# keep pyflakes on and treat that layout as a style choice rather than an error.
ignore = ["E401", "E701", "E702", "E731"]
