[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iqscan"
dynamic = ["version"]
description = "Find candidate activity in signed complex IQ recordings"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.25,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.scripts]
iqscan = "iq_scan:main"

[tool.setuptools]
py-modules = [
  "iq_scan",
  "iq_serve",
  "iq_wav",
  "report_interactive",
  "spectrum_refs",
]

[tool.setuptools.dynamic]
version = {attr = "iq_scan.__version__"}
